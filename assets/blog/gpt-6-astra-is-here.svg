<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GPT-6 Astra Is Here</title>
  <desc id="desc">A dark blue and violet visual representing GPT-6 Astra moving from conversation toward real computer work and software engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050914"/><stop offset="0.52" stop-color="#0b1b3e"/><stop offset="1" stop-color="#260b42"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#35b7ff"/><stop offset="0.52" stop-color="#716dff"/><stop offset="1" stop-color="#e25dff"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="36"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1600" height="900" rx="42" fill="url(#bg)"/>
  <circle cx="330" cy="160" r="190" fill="#2ba8ff" opacity=".14" filter="url(#blur)"/>
  <circle cx="1320" cy="170" r="220" fill="#da59ff" opacity=".13" filter="url(#blur)"/>
  <g fill="none" stroke="url(#glow)" opacity=".55">
    <path d="M60 670 C300 555 470 520 760 600 S1190 710 1540 545" stroke-width="10"/>
    <path d="M20 740 C300 600 520 600 760 660 S1210 760 1590 600" stroke-width="4"/>
    <path d="M40 790 C320 670 530 690 770 730 S1220 820 1560 675" stroke-width="2"/>
  </g>
  <g fill="#ffffff" opacity=".75">
    <circle cx="150" cy="250" r="3"/><circle cx="270" cy="340" r="4"/><circle cx="490" cy="170" r="3"/><circle cx="1100" cy="275" r="3"/><circle cx="1280" cy="340" r="4"/><circle cx="1450" cy="220" r="3"/>
  </g>
  <g transform="translate(575 150)">
    <rect x="0" y="0" width="450" height="360" rx="40" fill="#09162d" stroke="#6fcbff" stroke-width="3"/>
    <rect x="16" y="16" width="418" height="328" rx="30" fill="none" stroke="#7e65ff" stroke-width="2" opacity=".7"/>
    <circle cx="225" cy="120" r="70" fill="#101d3d" stroke="url(#glow)" stroke-width="10" filter="url(#soft)"/>
    <circle cx="225" cy="120" r="64" fill="#0d1834" stroke="#edf7ff" stroke-width="5"/>
    <path d="M190 112c15-40 84-44 99-4 8 23-7 47-34 55-26 8-58-2-65-26-3-10-2-18 0-25Z" fill="none" stroke="#edf7ff" stroke-width="5" stroke-linecap="round"/>
    <text x="225" y="245" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="800" text-anchor="middle">GPT-6</text>
    <text x="225" y="295" fill="#9dd9ff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle">ASTRA</text>
  </g>
  <g font-family="Inter,Arial,sans-serif" fill="#ffffff">
    <text x="92" y="112" font-size="28" font-weight="700" fill="#94d9ff">A DEVELOPER'S FIRST REACTION</text>
    <text x="92" y="188" font-size="68" font-weight="800">GPT-6 Astra Is Here.</text>
    <text x="92" y="263" font-size="52" font-weight="600" fill="#dfe8f6">The interesting part is not the number.</text>
    <text x="92" y="325" font-size="52" font-weight="600" fill="url(#glow)">It is what the model can actually do.</text>
    <text x="92" y="830" font-size="29" font-weight="600">Safiullah Korai · Software Engineer · AI Engineering in progress</text>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="1040" y="610" width="430" height="110" rx="28" fill="#09162d" stroke="#3dbbff" stroke-width="2"/>
    <text x="1070" y="652" fill="#8cd7ff" font-size="21" font-weight="700">FROM CHAT</text>
    <text x="1070" y="688" fill="#ffffff" font-size="28" font-weight="700">TO COMPUTER WORK</text>
    <rect x="1040" y="740" width="430" height="80" rx="24" fill="#251039" stroke="#d76cff" stroke-width="2"/>
    <text x="1070" y="790" fill="#f0c1ff" font-size="25" font-weight="700">BUILD · RESEARCH · EXECUTE</text>
  </g>
