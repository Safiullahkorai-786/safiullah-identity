<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Why I Switched From Software Engineer to AI Engineer</title>
  <desc id="desc">A visual journey from software engineering toward AI engineering, showing a developer at a fork between software and AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b18"/><stop offset="0.5" stop-color="#101b43"/><stop offset="1" stop-color="#210b3d"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39a7ff"/><stop offset="1" stop-color="#7d6cff"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8c6cff"/><stop offset="1" stop-color="#e05cff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="55"/></filter>
  </defs>
  <rect width="1600" height="900" rx="38" fill="url(#bg)"/>
  <circle cx="260" cy="190" r="180" fill="#1b8cff" opacity=".10" filter="url(#soft)"/>
  <circle cx="1330" cy="190" r="220" fill="#c24cff" opacity=".12" filter="url(#soft)"/>
  <path d="M60 770 C300 680 470 675 665 690" fill="none" stroke="#193c6e" stroke-width="100" opacity=".45"/>
  <path d="M1540 770 C1300 680 1130 675 935 690" fill="none" stroke="#54266e" stroke-width="100" opacity=".45"/>
  <path d="M80 770 C330 680 520 660 780 690" fill="none" stroke="#287fd0" stroke-width="18" opacity=".8"/>
  <path d="M1520 770 C1270 680 1080 660 820 690" fill="none" stroke="#b05af0" stroke-width="18" opacity=".8"/>
  <path d="M800 900 C800 820 790 760 800 690" fill="none" stroke="#f1f4ff" stroke-width="28"/>
  <g fill="#dceaff" opacity=".8"><circle cx="180" cy="220" r="4"/><circle cx="300" cy="330" r="3"/><circle cx="430" cy="150" r="4"/><circle cx="1120" cy="190" r="4"/><circle cx="1260" cy="330" r="3"/><circle cx="1420" cy="150" r="4"/></g>
  <g stroke="#3b9cff" stroke-width="3" opacity=".45"><path d="M250 450l90-90 90 70 100-110" fill="none"/><path d="M1080 420l90-90 90 60 110-120" fill="none"/></g>
  <g fill="none" stroke="#4ca9ff" stroke-width="6" opacity=".8"><rect x="350" y="360" width="190" height="125" rx="14"/><path d="M375 395h140M375 425h110M375 455h70"/></g>
  <g fill="none" stroke="#d46aff" stroke-width="5" opacity=".75"><circle cx="1270" cy="360" r="92"/><circle cx="1270" cy="360" r="55"/><path d="M1185 360h170M1270 275v170"/></g>
  <g fill="#fff" font-family="Inter,Arial,sans-serif">
    <text x="90" y="115" font-size="30" font-weight="600" fill="#8fcaff">A PERSONAL CAREER NOTE</text>
    <text x="90" y="190" font-size="68" font-weight="800">Why I Switched</text>
    <text x="90" y="270" font-size="68" font-weight="800">From Being</text>
    <text x="90" y="350" font-size="68" font-weight="800" fill="url(#blue)">Software Engineer</text>
    <text x="90" y="430" font-size="68" font-weight="800">to</text>
    <text x="190" y="430" font-size="68" font-weight="800" fill="url(#purple)">AI Engineer</text>
    <text x="90" y="485" font-size="30" fill="#d9e2f3">The evolution, not a farewell.</text>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-weight="700" text-anchor="middle">
    <rect x="390" y="520" width="210" height="62" rx="31" fill="#0b2340" stroke="#4ca9ff" stroke-width="3"/>
    <text x="495" y="560" font-size="25" fill="#8fcaff">SOFTWARE</text>
    <rect x="1000" y="520" width="210" height="62" rx="31" fill="#2a123d" stroke="#d46aff" stroke-width="3"/>
    <text x="1105" y="560" font-size="25" fill="#e7a5ff">AI ENGINEERING</text>
  </g>
  <g transform="translate(710 500)">
    <circle cx="90" cy="55" r="38" fill="#151a2a" stroke="#e9edff" stroke-width="5"/>
    <path d="M48 145 C52 92 128 92 132 145 L145 220 H35 Z" fill="#0c111c" stroke="#dfe7ff" stroke-width="5"/>
    <path d="M88 90 C75 115 68 142 70 180" fill="none" stroke="#5f91ff" stroke-width="6" opacity=".8"/>
    <path d="M92 90 C108 116 115 142 110 180" fill="none" stroke="#c66cff" stroke-width="6" opacity=".8"/>
  </g>
  <g fill="#fff" font-family="Inter,Arial,sans-serif">
    <text x="90" y="830" font-size="30" font-weight="700">Safiullah Korai</text>
    <text x="1510" y="830" text-anchor="end" font-size="25" fill="#b7c6e2">Software Engineering → AI Engineering</text>
  </g>
</svg>
