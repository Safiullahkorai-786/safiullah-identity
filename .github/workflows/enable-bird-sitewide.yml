name: Enable Flutter Bird Sitewide

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add bird assets to HTML pages
        shell: python
        run: |
          from pathlib import Path

          for path in Path('.').glob('*.html'):
              html = path.read_text(encoding='utf-8')
              original = html

              if 'css/bird.css' not in html:
                  html = html.replace('</head>', '  <link rel="stylesheet" href="css/bird.css">\n</head>', 1)

              if 'js/bird.js' not in html:
                  html = html.replace('</body>', '  <script src="js/bird.js"></script>\n</body>', 1)

              if html != original:
                  path.write_text(html, encoding='utf-8')

      - name: Commit sitewide bird integration
        run: |
          if git diff --quiet; then
            echo "No HTML changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Enable interactive Flutter bird across pages"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/enable-bird-sitewide.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time bird integration workflow"
          git push
