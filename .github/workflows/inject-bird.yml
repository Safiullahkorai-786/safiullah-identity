name: Add Home Bird

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject bird assets into Home
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = 'data-site-bird="enabled"'

          if marker in html:
              print('Bird already enabled; nothing to do.')
              raise SystemExit(0)

          html = html.replace(
              '<link rel="stylesheet" href="css/style.css">',
              '<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/bird.css">',
              1
          )
          html = html.replace(
              '<body class="home-glass">',
              '<body class="home-glass" data-site-bird="enabled">',
              1
          )
          html = html.replace(
              '<script src="js/site.js"></script>',
              '<script src="js/site.js"></script><script src="js/bird.js"></script>',
              1
          )

          path.write_text(html, encoding='utf-8')

      - name: Commit Home bird integration
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable interactive flying bird on home"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/inject-bird.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time bird injection workflow"
          git push
