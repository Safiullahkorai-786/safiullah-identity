name: Remove Bird Integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove bird references
        shell: python
        run: |
          from pathlib import Path
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace('<link rel="stylesheet" href="css/bird.css">', '')
              text = text.replace('<script src="js/bird.js"></script>', '')
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print(f'Cleaned {path}')

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No bird references found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Remove bird integration from all pages"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/remove-bird.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time bird cleanup workflow"
          git push
