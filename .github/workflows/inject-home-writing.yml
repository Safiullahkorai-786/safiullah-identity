name: Wire Home Writing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Home writing script
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="js/home-writing.js"></script>'
          if tag not in s:
              s = s.replace('<script src="js/site.js"></script>', '<script src="js/site.js"></script>' + tag, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show curated featured writing on Home"
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/inject-home-writing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time Home writing workflow"
          git push
